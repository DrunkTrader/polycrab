[package]
name = "polycrab"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
description = "PolyCrab: Rust copy trading for Polymarket."
repository = "https://github.com/DrunkTrader/polycrab"
readme = "README.md"

[[bin]]
name = "polycrab"
path = "src/main.rs"

# Hand-rolled timing loops rather than a benchmark dependency: `cargo bench`
# then needs no network and `make test --offline` keeps working. `test = false`
# stops `cargo test` from running the timing loops as if they were tests.
[[bench]]
name = "hot_path"
harness = false
test = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
futures-util = "0.3"

# HTTP / WebSocket
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Errors / logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto / Ethereum
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = "0.8"
alloy-signer = "0.5"
alloy-signer-local = "0.5"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Misc
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
